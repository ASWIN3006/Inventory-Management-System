server.port=8089

spring.datasource.url=jdbc:mysql://localhost:3306/dbpurchase?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate ddl auto (create, create-drop, update,validate): with "update" the database
# schema will be automatically updated accordingly to java entities found in
# the project
spring.jpa.hibernate.ddl-auto=update

# Show or not log for each sql query
spring.jpa.show-sql=true

# Allows Hibernate to generate SQL optimized for a particular DBMS
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

MaterialServiceConsumer.serviceURL=http://localhost:8088

MaterialCategoryConsumer.apiURL=/material/controller/getMaterialCategories
MaterialCategoryConsumer.apiURLForById=/material/controller/getMaterialCategoryById/

MaterialTypeConsumer.apiURL=/type/controller/getTypeDetails
MaterialTypeConsumer.apiURLByCategoryId=/type/controller/getTypeDetailsByCategoryId/

UnitServiceConsumer.apiURL=/unit/controller/getUnitDetails
UnitServiceConsumer.apiURLByCategoryId=/unit/controller/getUnitsByCategoryId/

VendorServiceConsumer.serviceURL=http://localhost:8087
VendorServiceConsumer.apiURL=/vendor/controller/getVendors